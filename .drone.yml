kind: pipeline
type: docker
name: diag

trigger:
  event:
    - pull_request

steps:
  - name: diag
    image: docker:24.0.5-cli
    volumes:
      - name: docker_socket
        path: /var/run/docker.sock
    commands:
      - sh diag.sh

volumes:
  - name: docker_socket
    host:
      path: /var/run/docker.sock
